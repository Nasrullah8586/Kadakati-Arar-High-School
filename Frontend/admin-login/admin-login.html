<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Kadakati Arar High School</title>

    <link rel="stylesheet" href="admin-login.css">
</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <!-- SCHOOL BRAND -->
            <div class="school-brand">

                <div class="logo-mark">
                    K
                </div>

                <h1>Kadakati Arar</h1>

                <span>HIGH SCHOOL</span>

            </div>


            <!-- LOGIN HEADING -->
            <div class="login-heading">

                <h2>Admin Login</h2>

                <p>
                    Sign in to access your admin account
                </p>

            </div>


            <!-- LOGIN FORM -->
            <form id="adminLoginForm">

                <!-- EMAIL / USERNAME -->
                <div class="form-group">

                    <label for="login">
                        Email or Username
                    </label>

                    <input
                        type="text"
                        id="login"
                        name="login"
                        placeholder="Enter email or username"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Show password"
                        >

                            <!-- EYE OFF -->
                            <svg
                                id="eyeOffIcon"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path d="M3 3l18 18"></path>
                                <path d="M10.58 10.58a2 2 0 0 0 2.83 2.83"></path>
                                <path d="M9.88 4.24A9.78 9.78 0 0 1 12 4c5 0 9.27 3.11 11 8a18.5 18.5 0 0 1-3.16 5.19"></path>
                                <path d="M6.61 6.61A18.5 18.5 0 0 0 1 12c1.73 4.89 6 8 11 8a9.78 9.78 0 0 0 2.12-.24"></path>
                            </svg>


                            <!-- EYE -->
                            <svg
                                id="eyeIcon"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                class="hidden"
                            >
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>

                        </button>

                    </div>

                </div>


                <!-- FORGOT PASSWORD -->
                <div class="forgot-wrapper">

                    <button
                        type="button"
                        id="forgotPasswordBtn"
                        class="forgot-password"
                    >
                        Forgot Password?
                    </button>

                </div>


                <!-- MESSAGE -->
                <p
                    id="loginMessage"
                    class="login-message"
                ></p>


                <!-- LOGIN BUTTON -->
                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >
                    Login
                </button>

            </form>


            <!-- BACK -->
            <a
                href="../index.html"
                class="back-link"
            >
                ← Back to Website
            </a>

        </div>

    </main>


    <!-- RESET PASSWORD MODAL -->

    <div
        id="resetModal"
        class="modal hidden"
    >

        <div class="reset-card">

            <button
                type="button"
                id="closeResetModal"
                class="close-modal"
            >
                ×
            </button>

            <h2>Reset Password</h2>

            <p class="reset-description">
                Enter your email, verification code,
                and create a new password.
            </p>


            <!-- EMAIL -->
            <div class="form-group">

                <label for="resetEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="resetEmail"
                    placeholder="Enter your email"
                >

            </div>


            <!-- SEND CODE -->
            <button
                type="button"
                id="sendResetCodeBtn"
                class="secondary-button"
            >
                Send Reset Code
            </button>


            <!-- RESET CODE -->
            <div class="form-group">

                <label for="resetCode">
                    Reset Code
                </label>

                <input
                    type="text"
                    id="resetCode"
                    placeholder="Enter 6 digit code"
                    maxlength="6"
                    inputmode="numeric"
                >

            </div>


            <!-- NEW PASSWORD -->
            <div class="form-group">

                <label for="newPassword">
                    New Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                    >

                    <button
                        type="button"
                        class="password-toggle reset-toggle"
                        data-target="newPassword"
                    >
                        <span class="eye-off-small">◉̸</span>
                    </button>

                </div>

            </div>


            <!-- CONFIRM PASSWORD -->
            <div class="form-group">

                <label for="confirmPassword">
                    Confirm New Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                    >

                    <button
                        type="button"
                        class="password-toggle reset-toggle"
                        data-target="confirmPassword"
                    >
                        <span class="eye-off-small">◉̸</span>
                    </button>

                </div>

            </div>


            <p
                id="resetMessage"
                class="login-message"
            ></p>


            <button
                type="button"
                id="resetPasswordBtn"
                class="login-button"
            >
                Reset Password
            </button>

        </div>

    </div>


    <script src="admin-login.js"></script>

</body>

</html>
