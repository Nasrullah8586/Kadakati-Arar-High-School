<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Login | Kadakati Arar High School</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->
    <nav class="navbar">

        <div class="logo">
            <h2>Kadakati Arar High School</h2>
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#about">About</a>
            <a href="index.html#teachers">Teachers</a>
            <a href="index.html#gallery">Gallery</a>
            <a href="index.html#contact">Contact</a>
        </div>

        <div class="auth-buttons">
            <button id="teacherLoginBtn">Teacher Login</button>
            <button id="adminLoginBtn">Admin Login</button>
        </div>

    </nav>


    <!-- ================= TEACHER LOGIN ================= -->
    <section class="login-section">

        <div class="login-card">

            <h1>Teacher Login</h1>

            <p class="login-subtitle">
                Login to manage your teacher profile
            </p>

            <form id="teacherLoginForm">

                <div class="form-group">
                    <label for="username">Username</label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your username"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>


                <button type="submit" class="login-submit">
                    Login
                </button>

            </form>

            <p id="loginMessage"></p>

            <div class="login-back">
                <a href="index.html">← Back to Home</a>
            </div>

        </div>

    </section>


    <!-- ================= FOOTER ================= -->
    <footer>
        <p>
            © 2026 Kadakati Arar High School. All Rights Reserved.
        </p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
